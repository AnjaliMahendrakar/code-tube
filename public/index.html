<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CodeTube</title>
  <meta name="description" content="Hand-picked videos for learning to code and cracking interviews, in English, Hindi and Telugu.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <a class="logo" href="/" aria-label="CodeTube home">
      <svg class="logo-mark" viewBox="0 0 30 21" aria-hidden="true"><rect width="30" height="21" rx="5"/><path d="M12 6l8 4.5-8 4.5z"/></svg>
      <span class="logo-text">CodeTube</span>
    </a>
    <form class="search" id="search" role="search" autocomplete="off">
      <div class="search-box">
        <label class="vh" for="q">Search</label>
        <input id="q" name="search_query" type="search" placeholder="Search" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>
      <button class="search-btn" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
      </button>
    </form>
    <a class="icon-btn" href="/feed/history" aria-label="Watch history" title="Watch history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.97 16.95 10 13.87V7h2v5.76l4.03 2.49-1.06 1.7zM22 12c0 5.51-4.49 10-10 10S2 17.51 2 12h1c0 4.96 4.04 9 9 9s9-4.04 9-9-4.04-9-9-9C8.81 3 5.92 4.64 4.28 7.38c-.11.18-.22.37-.31.56L3.94 8H8v1H1.96V3h1v4.74c.04-.09.07-.17.11-.25.11-.22.23-.42.35-.63C5.22 3.86 8.51 2 12 2c5.51 0 10 4.49 10 10z"/></svg>
    </a>
  </header>

  <nav class="guide" aria-label="Main">
    <a href="/" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V10.08l8-6.96 8 6.96V21h-6v-6h-4v6H4z"/></svg><span>Home</span>
    </a>
    <a href="/paths" data-nav="paths">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 7H2v1h20V7zm-9 5H2v-1h11v1zm0 4H2v-1h11v1zm2 3v-8l7 4-7 4z"/></svg><span>Paths</span>
    </a>
    <a href="/feed/history" data-nav="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.97 16.95 10 13.87V7h2v5.76l4.03 2.49-1.06 1.7zM12 3c-4.96 0-9 4.04-9 9s4.04 9 9 9 9-4.04 9-9-4.04-9-9-9m0-1c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/></svg><span>History</span>
    </a>
  </nav>

  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js" defer></script>
</body>
</html>
